name: CI — Tests & Self-Audit (AccessiKit EAA/RGAA v5)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-dogfood:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: node --test tests/audit.test.mjs

      - name: Dogfood AccessiKit Action on docs/index.html (require >= 95/100)
        id: a11y
        uses: ./
        with:
          target: "docs"
          report-output: "accessikit-report.json"
          min-score: "95"
          fail-on-error: "true"

      - name: Verify generated JSON report
        run: |
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("accessikit-report.json", "utf8"));
            if (r.summary.filesAudited < 1 || r.summary.averageScore < 95) process.exit(1);
            console.log("Verified AccessiKit report:", r.summary);
          '
          echo "Outputs: score=${{ steps.a11y.outputs.average-score }}, status=${{ steps.a11y.outputs.rgaa-status }}"
